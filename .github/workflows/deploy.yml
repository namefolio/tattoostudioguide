name: Deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *' # daily rebuild so expired Verified listings drop to Basic
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Until real listings exist, set the repo variable INCLUDE_DEMO=1 to deploy the demo build.
      - run: npm run build
        env: { PUBLIC_INCLUDE_DEMO: '${{ vars.INCLUDE_DEMO }}' }
      - run: npm run check:wording
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
